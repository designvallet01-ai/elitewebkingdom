name: Build Elite IDE Offline Desktop (Windows & MacBook)

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'COMPLIER/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

jobs:
  build-mac:
    name: Build macOS DMG for MacBook (Apple Silicon & Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: COMPLIER/package-lock.json

      - name: Install dependencies
        working-directory: COMPLIER
        run: npm ci

      - name: Build frontend studio (Vite)
        working-directory: COMPLIER
        run: npx vite build

      - name: Build macOS DMG & ZIP
        working-directory: COMPLIER
        run: npx electron-builder --config electron-builder.json --mac --x64 --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS Desktop Installers
        uses: actions/upload-artifact@v4
        with:
          name: Elite-IDE-Offline-MacOS
          path: dist-desktop/*.dmg
          if-no-files-found: warn

  build-windows:
    name: Build Windows Setup & Portable .exe
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: COMPLIER/package-lock.json

      - name: Install dependencies
        working-directory: COMPLIER
        run: npm ci

      - name: Build frontend studio (Vite)
        working-directory: COMPLIER
        run: npx vite build

      - name: Build Windows .exe
        working-directory: COMPLIER
        run: npx electron-builder --config electron-builder.json --win --x64

      - name: Upload Windows Desktop Installers
        uses: actions/upload-artifact@v4
        with:
          name: Elite-IDE-Offline-Windows
          path: dist-desktop/*.exe
